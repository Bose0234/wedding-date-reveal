<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realistic Curtain Animation</title>
  <style>



* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

html {
  background: #fff1e6;
}

body {
  overflow: hidden;
  font-family: Georgia, "Times New Roman", serif;
  background: #fff1e6;
}

.theater {
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 480px;
  overflow: hidden;
  background: #fff1e6;
  color: #8f1933;
}

.stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 50% 36%,
      #fffdf5 0%,
      #fff4e8 40%,
      #ffe5d8 72%,
      #f4c9bd 100%
    );
  opacity: 1;
  transition: opacity 1.2s ease;
}

.stage::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at 50% 30%,
      rgba(255, 255, 224, 0.7),
      transparent 56%
    ),
    radial-gradient(
      ellipse at 50% 100%,
      rgba(189, 75, 81, 0.09),
      transparent 50%
    );
}

.stage::after {
  content: "";
  position: absolute;
  inset: -40%;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(
    110deg,
    transparent 38%,
    rgba(255, 222, 158, 0.06) 46%,
    rgba(255, 245, 210, 0.23) 50%,
    rgba(255, 222, 158, 0.06) 54%,
    transparent 62%
  );
  transform: translateX(-70%);
  animation: goldenSweep 12s ease-in-out infinite;
}

.spotlight {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(
    ellipse at 50% 35%,
    rgba(255, 247, 217, 0.8) 0%,
    rgba(248, 215, 168, 0.25) 38%,
    transparent 72%
  );
  animation: spotlightPulse 6s ease-in-out infinite alternate;
}

.floor {
  display: none;
}

.welcome {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: min(90%, 800px);
  text-align: center;
  transform: translate(-50%, -50%);
  opacity: 1;
  visibility: visible;
  transition:
    opacity 1.2s ease,
    visibility 1.2s ease;
}

.welcome p {
  margin: 0 0 16px;
  color: #ad792f;
  font-family: Arial, sans-serif;
  font-size: clamp(10px, 1.4vw, 14px);
  letter-spacing: clamp(3px, 0.7vw, 7px);
  line-height: 1.8;
  animation: introFade 1.2s ease both;
}

.welcome h1 {
  margin: 0;
  color: #9e1934;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(54px, 10vw, 120px);
  font-weight: normal;
  line-height: 1.08;
  animation:
    introFade 1.5s ease 0.2s both,
    welcomeGlow 4s ease-in-out 2s infinite alternate;
}

.welcome span {
  display: block;
  margin-top: 20px;
  color: #895b50;
  font-size: clamp(13px, 2vw, 19px);
  line-height: 1.7;
  animation: introFade 1.5s ease 0.5s both;
}

.welcome img {
  display: block;
  max-width: 100%;
  height: auto;
  margin-top: 24px;
  object-fit: contain;
  animation: introFade 1.5s ease 0.7s both;
}

.theater.date-mode .stage .welcome {
  opacity: 0;
  visibility: hidden;
}

.theater.date-mode .stage .spotlight {
  opacity: 0;
}

.theater.date-mode .stage::after {
  opacity: 0;
}

.theater.date-mode .stage {
  opacity: 1;
}

/* Start button */

.start-wedding {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: max-content;
  max-width: 88%;
  padding: 23px 34px;
  border: 1px solid #e6c47f;
  border-radius: 3px;
  background: linear-gradient(145deg, #fff8e9, #f1d9b3);
  color: #8f1933;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 20px;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 8px 35px rgba(38, 0, 13, 0.3),
    inset 0 0 0 4px rgba(255, 255, 255, 0.25);
  transform: translate(-50%, -50%);
  transition:
    opacity 0.8s ease,
    transform 0.8s ease,
    box-shadow 0.3s ease;
}

.start-wedding:hover {
  transform: translate(-50%, -50%) scale(1.04);
  box-shadow: 0 12px 40px rgba(38, 0, 13, 0.38);
}

.start-wedding:focus-visible {
  outline: 3px solid #f4d28b;
  outline-offset: 5px;
}

.start-icon {
  color: #b51f3c;
  font-size: 29px;
}

.start-subtitle {
  color: #9c7040;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  line-height: 1.7;
  text-align: center;
  text-transform: uppercase;
}

.theater.started .start-wedding {
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -55%);
}

/* Velvet curtains */

.curtain {
  position: absolute;
  top: 0;
  bottom: 0;
  z-index: 10;
  width: 50.5%;
  overflow: hidden;
  background:
    linear-gradient(
      90deg,
      #650b20 0%,
      #8c102b 4%,
      #b91f3c 9%,
      #e05260 13%,
      #b51b37 17%,
      #741027 22%,
      #a91632 27%,
      #e14a59 32%,
      #b21c38 37%,
      #780d25 43%,
      #c52a45 49%,
      #ed6570 54%,
      #b51c38 59%,
      #790e26 65%,
      #a91933 71%,
      #d63c50 76%,
      #9b1630 82%,
      #650b20 89%,
      #b9203c 95%,
      #760d25 100%
    );
  box-shadow:
    inset -18px 0 28px -18px rgba(35, 0, 10, 0.85),
    inset 18px 0 28px -18px rgba(255, 164, 151, 0.4),
    inset 0 0 60px rgba(54, 0, 15, 0.22);
  will-change: transform;
  transition:
    transform 4.5s cubic-bezier(0.65, 0, 0.35, 1),
    filter 4.5s ease;
}

.curtain.left {
  left: 0;
  transform: translateX(0);
  transform-origin: left center;
}

.curtain.right {
  right: 0;
  transform: translateX(0);
  transform-origin: right center;
}

.theater.open .curtain.left {
  transform: translateX(-100%);
  filter: brightness(0.88);
}

.theater.open .curtain.right {
  transform: translateX(100%);
  filter: brightness(0.88);
}

.curtain::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255, 190, 166, 0.17) 0,
      rgba(255, 190, 166, 0.07) 3px,
      transparent 7px,
      rgba(44, 0, 14, 0.18) 13px,
      rgba(45, 0, 14, 0.3) 19px,
      transparent 27px,
      rgba(255, 177, 159, 0.13) 34px,
      transparent 44px
    ),
    linear-gradient(
      180deg,
      rgba(255, 205, 180, 0.2),
      transparent 30%,
      rgba(46, 0, 15, 0.28) 100%
    );
  mix-blend-mode: soft-light;
}

.curtain::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255, 179, 156, 0.24) 3%,
    transparent 8%,
    rgba(45, 0, 15, 0.2) 15%,
    transparent 22%,
    rgba(255, 176, 157, 0.2) 30%,
    transparent 38%,
    rgba(40, 0, 12, 0.23) 47%,
    transparent 54%,
    rgba(255, 185, 162, 0.18) 62%,
    transparent 70%,
    rgba(40, 0, 12, 0.2) 79%,
    transparent 87%,
    rgba(255, 185, 162, 0.14) 95%,
    transparent 100%
  );
  opacity: 0.8;
}

.folds {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    90deg,
    rgba(49, 0, 14, 0.22) 0,
    rgba(49, 0, 14, 0.08) 5px,
    rgba(255, 194, 170, 0.14) 12px,
    rgba(255, 194, 170, 0.26) 18px,
    rgba(255, 194, 170, 0.05) 25px,
    rgba(38, 0, 12, 0.18) 34px,
    transparent 43px
  );
  opacity: 0.85;
}

/* Decorative top curtain valance */

.valance {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 12;
  width: 100%;
  height: clamp(60px, 9vh, 110px);
  pointer-events: none;
  background:
    linear-gradient(
      180deg,
      #8d1029 0%,
      #c42b45 14%,
      #e55a65 35%,
      #b41b36 65%,
      #7d0d24 88%,
      #59081b 100%
    );
  border-radius: 0 0 50% 50% / 0 0 12% 12%;
  box-shadow:
    inset 0 -5px 9px rgba(54, 0, 14, 0.32),
    inset 0 5px 8px rgba(255, 187, 163, 0.15),
    0 7px 18px rgba(62, 0, 15, 0.28);
  transition: opacity 1.5s ease;
}

.valance::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: repeating-linear-gradient(
    90deg,
    transparent 0 7%,
    rgba(255, 188, 157, 0.2) 8%,
    rgba(65, 0, 17, 0.18) 10%,
    transparent 13%,
    transparent 17%
  );
}

.theater.open .valance {
  opacity: 0;
}

/* Fireworks canvas */

#fireworks {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Wedding date reveal */

.date-reveal {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: min(86vw, 980px);
  min-height: min(64vh, 600px);
  padding: clamp(32px, 6vw, 70px);
  overflow: hidden;
  border: 8px solid #f4dfb9;
  outline: 1px solid #c89b54;
  outline-offset: -15px;
  background:
    radial-gradient(
      ellipse at 50% 45%,
      #fffdf5 0%,
      #fff2e8 48%,
      #f6d2cc 100%
    );
  color: #8f1933;
  text-align: center;
  box-shadow: 0 15px 55px rgba(106, 22, 39, 0.12);
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, -46%) scale(0.96);
  transition:
    opacity 1.4s ease,
    visibility 1.4s ease,
    transform 1.4s cubic-bezier(0.2, 0.7, 0.2, 1);
}

.theater.date-mode .date-reveal {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
}

.date-reveal::before {
  content: "";
  position: absolute;
  inset: 22px;
  z-index: 0;
  pointer-events: none;
  border: 1px solid #d8b777;
  background:
    radial-gradient(
      circle at 0 0,
      rgba(181, 31, 60, 0.09) 0 90px,
      transparent 92px
    ),
    radial-gradient(
      circle at 100% 0,
      rgba(181, 31, 60, 0.09) 0 90px,
      transparent 92px
    ),
    radial-gradient(
      circle at 0 100%,
      rgba(181, 31, 60, 0.09) 0 90px,
      transparent 92px
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(181, 31, 60, 0.09) 0 90px,
      transparent 92px
    );
}

/* Flower shower background canvas */

#flower-sprinkle {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.theater.date-mode #flower-sprinkle {
  opacity: 1;
}

.theater.open:not(.date-mode) #flower-sprinkle {
  opacity: 0;
}

/* Date content remains above the flower shower */

.date-content {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  gap: 12px;
}

.floral-corner {
  position: absolute;
  z-index: 4;
  color: #a51d39;
  font-family: Georgia, serif;
  font-size: clamp(32px, 6vw, 76px);
  line-height: 0.95;
  text-align: center;
  text-shadow: 0 2px 0 #f4d89d;
  pointer-events: none;
  transform-origin: center;
  animation: floralFloat 5s ease-in-out infinite alternate;
}

.floral-top-left {
  top: 5%;
  left: 5%;
}

.floral-top-right {
  top: 5%;
  right: 5%;
  animation-delay: -2s;
}

.floral-bottom-left {
  bottom: 5%;
  left: 5%;
  animation-delay: -3s;
}

.floral-bottom-right {
  right: 5%;
  bottom: 5%;
  animation-delay: -1s;
}

.date-reveal .date-label {
  position: relative;
  z-index: 3;
  margin: 0;
  color: #a51d39;
  font-family: Georgia, serif;
  font-size: clamp(24px, 4vw, 42px);
  letter-spacing: 2px;
  opacity: 0;
  transform: translateY(15px);
  transition:
    opacity 1s ease 0.5s,
    transform 1s ease 0.5s;
}

.date-reveal .date-subtitle {
  position: relative;
  z-index: 3;
  color: #aa7a34;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: clamp(3px, 0.8vw, 7px);
  opacity: 0;
  transform: translateY(15px);
  transition:
    opacity 1s ease 0.7s,
    transform 1s ease 0.7s;
}

.date-reveal h2 {
  position: relative;
  z-index: 3;
  margin: 0;
  color: #9b1833;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(38px, 8vw, 100px);
  font-weight: normal;
  letter-spacing: clamp(0px, 0.4vw, 4px);
  line-height: 1.2;
  white-space: nowrap;
  text-shadow: 0 2px 0 #f2d9a5;
  opacity: 0;
  transform: translateY(20px);
  transition:
    opacity 1.2s ease 0.9s,
    transform 1.2s ease 0.9s;
}

.theater.date-mode .date-reveal h2 {
  background: linear-gradient(
    110deg,
    #8f1933 20%,
    #c18c3e 42%,
    #fff0bd 50%,
    #c18c3e 58%,
    #8f1933 80%
  );
  background-size: 220% auto;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: dateShimmer 6s ease-in-out 1.5s infinite;
}

.date-divider {
  position: relative;
  z-index: 3;
  color: #bf8d3e;
  font-size: clamp(22px, 3vw, 32px);
  letter-spacing: 8px;
  opacity: 0;
  transform: translateY(12px);
  transition:
    opacity 1s ease 1.1s,
    transform 1s ease 1.1s;
}

.date-reveal .date-message {
  position: relative;
  z-index: 3;
  max-width: 90%;
  color: #88564b;
  font-family: Arial, sans-serif;
  font-size: clamp(12px, 1.8vw, 16px);
  letter-spacing: 0.5px;
  line-height: 1.7;
  opacity: 0;
  transform: translateY(12px);
  transition:
    opacity 1s ease 1.3s,
    transform 1s ease 1.3s;
}

.theater.date-mode .date-reveal .date-label,
.theater.date-mode .date-reveal .date-subtitle,
.theater.date-mode .date-reveal h2,
.theater.date-mode .date-reveal .date-divider,
.theater.date-mode .date-reveal .date-message {
  opacity: 1;
  transform: translateY(0);
}

/* Hide any old controls */

.controls {
  display: none !important;
}

/* Motion effects */

@keyframes goldenSweep {
  0%, 20% {
    transform: translateX(-70%);
  }
  80%, 100% {
    transform: translateX(70%);
  }
}

@keyframes spotlightPulse {
  from {
    opacity: 0.7;
  }
  to {
    opacity: 1;
  }
}

@keyframes introFade {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes welcomeGlow {
  from {
    text-shadow: 0 0 0 rgba(212, 163, 79, 0);
  }
  to {
    text-shadow: 0 0 22px rgba(212, 163, 79, 0.35);
  }
}

@keyframes dateShimmer {
  0%, 15% {
    background-position: 100% center;
  }
  85%, 100% {
    background-position: -100% center;
  }
}

@keyframes floralFloat {
  from {
    transform: translateY(0) rotate(-2deg);
  }
  to {
    transform: translateY(-6px) rotate(2deg);
  }
}

/* Responsive */

@media (max-width: 600px) {
  .theater {
    min-height: 420px;
  }

  .valance {
    height: 65px;
  }

  .welcome {
    width: 88%;
  }

  .welcome p {
    letter-spacing: 3px;
  }

  .welcome span {
    max-width: 90%;
    margin-top: 14px;
  }

  .welcome img {
    max-width: 80%;
    margin-top: 18px;
  }

  .start-wedding {
    gap: 8px;
    padding: 18px 25px;
    font-size: 18px;
  }

  .start-subtitle {
    font-size: 9px;
    letter-spacing: 1.5px;
  }

  .date-reveal {
    inset: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    padding: 24px 12px;
    border: none;
    outline: none;
  }

  .date-reveal::before {
    inset: 10px;
  }

  .date-content {
    gap: 10px;
  }

  .date-reveal .date-label {
    font-size: 25px;
  }

  .date-reveal .date-subtitle {
    font-size: 9px;
    letter-spacing: 3px;
  }

  .date-reveal h2 {
    font-size: clamp(32px, 9vw, 54px);
    letter-spacing: 0;
  }

  .date-divider {
    font-size: 22px;
    letter-spacing: 5px;
  }

  .date-reveal .date-message {
    max-width: 240px;
    font-size: 12px;
  }

  .floral-corner {
    font-size: clamp(25px, 8vw, 42px);
  }

  .floral-top-left,
  .floral-top-right {
    top: 4%;
  }

  .floral-bottom-left,
  .floral-bottom-right {
    bottom: 4%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stage::after,
  .spotlight,
  .welcome h1,
  .floral-corner,
  .theater.date-mode .date-reveal h2 {
    animation: none !important;
  }

  .curtain,
  .date-reveal,
  .start-wedding {
    transition-duration: 0.01ms !important;
  }
}



/* Full-screen wedding date reveal */

.date-reveal {
  position: absolute;
  inset: 0;
  top: 0;
  left: 0;
  z-index: 3;

  width: 100%;
  height: 100%;
  min-height: 100%;
  padding: clamp(24px, 5vw, 70px);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  border: none;
  outline: none;
  border-radius: 0;
  box-shadow: none;

  background:
    radial-gradient(
      ellipse at 50% 40%,
      #fffdf6 0%,
      #fff4e9 48%,
      #f9dfd3 100%
    );

  opacity: 0;
  visibility: hidden;
  transform: none;

  transition:
    opacity 1.4s ease,
    visibility 1.4s ease;
}

.theater.date-mode .date-reveal {
  inset: 0;
  opacity: 1;
  visibility: visible;
  transform: none;
}

/* Subtle full-screen ornamental border */

.date-reveal::before {
  content: "";
  position: absolute;
  inset: 18px;
  z-index: 0;
  pointer-events: none;

  border: 1px solid #d8b777;

  background:
    radial-gradient(
      circle at 0 0,
      #b51f3c12 0 120px,
      transparent 122px
    ),
    radial-gradient(
      circle at 100% 0,
      #b51f3c12 0 120px,
      transparent 122px
    ),
    radial-gradient(
      circle at 0 100%,
      #b51f3c12 0 120px,
      transparent 122px
    ),
    radial-gradient(
      circle at 100% 100%,
      #b51f3c12 0 120px,
      transparent 122px
    );
}

/* Full-screen flower shower */

#flower-sprinkle {
  position: absolute;
  inset: 0;
  z-index: 1;

  display: block;
  width: 100%;
  height: 100%;

  pointer-events: none;
  opacity: 0;

  transition: opacity 1.5s ease;
}

.theater.date-mode #flower-sprinkle {
  opacity: 1;
}

.theater.open:not(.date-mode) #flower-sprinkle {
  opacity: 0;
}

/* Keep date content above the flowers */

.date-content {
  position: relative;
  z-index: 3;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  width: min(90%, 1000px);
  gap: clamp(12px, 2vh, 24px);
  text-align: center;
}

/* Keep decorative flowers above the shower */

.floral-corner {
  z-index: 4;
}

/* Make the date typography prominent */

.date-reveal h2 {
  font-size: clamp(42px, 9vw, 112px);
  white-space: nowrap;
}

.date-reveal .date-label {
  font-size: clamp(28px, 4vw, 48px);
}

.date-reveal .date-message {
  max-width: min(90%, 600px);
  font-size: clamp(13px, 1.8vw, 18px);
}

@media (max-width: 600px) {
  .date-reveal {
    padding: 24px 12px;
  }

  .date-reveal::before {
    inset: 10px;
  }

  .date-reveal h2 {

  <script>
  

const theater = document.getElementById("theater");
const canvas = document.getElementById("fireworks");

/* ================================
   Wedding Photo Gallery
================================ */

const photoGallery = document.getElementById("photoGallery");
const galleryGrid = document.getElementById("galleryGrid");

const CURTAIN_DURATION = 4500;
const INTRO_DURATION = 4500;
const GALLERY_STAGGER_INTERVAL = 28;
const GALLERY_POPUP_DURATION = 240;
const GALLERY_HOLD_AFTER_REVEAL = 8500;
const GALLERY_EXIT_DURATION = 650;
const TOTAL_DURATION = 30000;

let galleryStarted = false;
let dateHasStarted = false;
let galleryTimer = null;
let galleryRevealTimers = [];

const galleryImages = Array.from({ length: 64 }, (_, index) => {
  const number = String(index + 1).padStart(2, "0");
  return `./Assets/gallery/photo-${number}.jpg`;
});

const galleryTiles = galleryImages.map((src, index) => {
  const tile = document.createElement("div");
  tile.className = "gallery-tile";
  const img = document.createElement("img");
  img.src = src;
  img.alt = `Wedding memory ${index + 1}`;
  img.loading = "eager";
  img.decoding = "async";
  tile.appendChild(img);
  galleryGrid.appendChild(tile);
  return { tile, img };
});

// Start fetching all photos early; image loading never blocks the timeline.
function preloadGalleryImages() {
  galleryTiles.forEach(({ img }) => {
    if (img.complete && img.naturalWidth > 0 && img.decode) {
      img.decode().catch(() => {});
    }
  });
}

function revealGallery() {
  if (galleryStarted || dateHasStarted) return;
  galleryStarted = true;
  photoGallery.classList.remove("is-leaving");
  photoGallery.classList.add("is-active");
  preloadGalleryImages();

  galleryTiles.forEach(({ tile }, index) => {
    const timer = setTimeout(() => {
      if (!dateHasStarted) tile.classList.add("is-visible");
    }, index * GALLERY_STAGGER_INTERVAL);
    galleryRevealTimers.push(timer);
  });

  const revealDuration = (galleryTiles.length - 1) * GALLERY_STAGGER_INTERVAL + GALLERY_POPUP_DURATION;
  galleryTimer = setTimeout(showDateReveal, revealDuration + GALLERY_HOLD_AFTER_REVEAL);
}

function showDateReveal() {
  if (dateHasStarted) return;
  dateHasStarted = true;
  clearTimeout(galleryTimer);
  galleryRevealTimers.forEach(clearTimeout);
  galleryRevealTimers = [];

  // Hide the welcome scene BEFORE the gallery starts fading. The gallery
  // remains above the stage during the fade, so date-mode can be activated
  // immediately without exposing the welcome screen underneath it.
  theater.classList.add("date-mode");
  photoGallery.style.visibility = "visible";
  photoGallery.classList.remove("is-active");
  photoGallery.classList.add("is-leaving");

  startFireworks();
  if (!flowerActive) startFlowers();

  setTimeout(() => {
    photoGallery.classList.remove("is-leaving");
    photoGallery.style.visibility = "hidden";
  }, GALLERY_EXIT_DURATION);
}

const ctx = canvas.getContext("2d");
const bgMusic = document.getElementById("bgMusic");
const startButton = document.getElementById("startWedding");
const flowerCanvas = document.getElementById("flower-sprinkle");
const flowerCtx = flowerCanvas ? flowerCanvas.getContext("2d") : null;
const welcomeFlowerCanvas = document.getElementById("welcome-flowers");
const welcomeFlowerCtx = welcomeFlowerCanvas
  ? welcomeFlowerCanvas.getContext("2d")
  : null;


let animationTimers = [];
let animationStartTime = 0;
let animationRunning = false;

let animationFrame = null;
let particles = [];
let rockets = [];
let lastLaunch = 0;
let fireworksActive = false;

let flowerFrame = null;
let flowers = [];
let flowerActive = false;

function scheduleAnimation(callback, delay) {
  const timer = setTimeout(callback, delay);
  animationTimers.push(timer);
}

function clearAnimationTimers() {
  animationTimers.forEach(clearTimeout);
  animationTimers = [];
}

function resizeCanvas(canvasElement, context) {
  if (!canvasElement || !context) return;

  const rect = canvasElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvasElement.width = Math.round(rect.width * dpr);
  canvasElement.height = Math.round(rect.height * dpr);

  context.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resizeAllCanvases() {
  resizeCanvas(canvas, ctx);
  resizeCanvas(flowerCanvas, flowerCtx);
  resizeCanvas(welcomeFlowerCanvas, welcomeFlowerCtx);
}

/* Background music */

function playBackgroundMusic() {
  if (!bgMusic) return Promise.resolve();

  bgMusic.loop = true;
  bgMusic.volume = 0.5;

  return bgMusic.play().catch(error => {
    console.warn("Music playback was blocked:", error);
  });
}

/* Fireworks */

function launchRocket() {
  const width = theater.clientWidth;
  const height = theater.clientHeight;

  const x = width * (0.15 + Math.random() * 0.7);
  const targetY = height * (0.12 + Math.random() * 0.38);

  const colors = [
    "#ffd27d",
    "#ff9b54",
    "#fff0c2",
    "#f7c6a3",
    "#f5e3a1"
  ];

  rockets.push({
    x,
    y: height + 5,
    targetY,
    speed: 5 + Math.random() * 2,
    color: colors[Math.floor(Math.random() * colors.length)]
  });
}

function explode(x, y, color) {
  const count = 65 + Math.floor(Math.random() * 45);

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4.5;

    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1,
      decay: 0.008 + Math.random() * 0.012,
      radius: 1 + Math.random() * 2,
      color
    });
  }
}

function animateFireworks(timestamp) {
  if (!fireworksActive) return;

  const width = theater.clientWidth;
  const height = theater.clientHeight;

  ctx.clearRect(0, 0, width, height);

  if (timestamp - lastLaunch > 650 + Math.random() * 500) {
    launchRocket();
    lastLaunch = timestamp;
  }

  rockets = rockets.filter(rocket => {
    rocket.y -= rocket.speed;

    ctx.beginPath();
    ctx.arc(rocket.x, rocket.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = rocket.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = rocket.color;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (rocket.y <= rocket.targetY) {
      explode(rocket.x, rocket.y, rocket.color);
      return false;
    }

    return true;
  });

  particles = particles.filter(particle => {
    particle.x += particle.vx;
    particle.y += particle.vy;

    particle.vx *= 0.985;
    particle.vy = particle.vy * 0.985 + 0.025;
    particle.alpha -= particle.decay;

    if (particle.alpha <= 0) return false;

    ctx.globalAlpha = particle.alpha;
    ctx.fillStyle = particle.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = particle.color;

    ctx.beginPath();
    ctx.arc(
      particle.x,
      particle.y,
      particle.radius,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.shadowBlur = 0;

    return true;
  });

  ctx.globalAlpha = 1;
  animationFrame = requestAnimationFrame(animateFireworks);
}

function startFireworks() {
  stopFireworks();
  resizeCanvas(canvas, ctx);

  fireworksActive = true;
  particles = [];
  rockets = [];
  lastLaunch = 0;

  launchRocket();
  launchRocket();

  animationFrame = requestAnimationFrame(animateFireworks);
}

function stopFireworks() {
  fireworksActive = false;

  if (animationFrame !== null) {
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }

  particles = [];
  rockets = [];

  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* Floating flowers and petals on both full-screen scenes */

function makeFlower(initial = false) {
  const width = theater.clientWidth;
  const height = theater.clientHeight;

  return {
    x: Math.random() * width,
    y: initial ? Math.random() * height : -20,
    size: 4 + Math.random() * 7,
    speed: 0.55 + Math.random() * 1.25,
    drift: Math.random() * 0.9 - 0.45,
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.035,
    type: Math.random() > 0.4 ? "petal" : "flower",
    color: [
      "#c52d49",
      "#e77e91",
      "#f4b9c2",
      "#fffaf0",
      "#d7ad58"
    ][Math.floor(Math.random() * 5)]
  };
}

function drawFlower(context, flower) {
  context.save();
  context.translate(flower.x, flower.y);
  context.rotate(flower.angle);
  context.globalAlpha = 0.88;
  context.fillStyle = flower.color;

  if (flower.type === "petal") {
    context.beginPath();
    context.ellipse(0, 0, flower.size * 0.55, flower.size, 0, 0, Math.PI * 2);
    context.fill();
  } else {
    for (let i = 0; i < 5; i++) {
      context.rotate((Math.PI * 2) / 5);
      context.beginPath();
      context.ellipse(
        0,
        -flower.size * 0.45,
        flower.size * 0.3,
        flower.size * 0.55,
        0,
        0,
        Math.PI * 2
      );
      context.fill();
    }

    context.beginPath();
    context.arc(0, 0, flower.size * 0.18, 0, Math.PI * 2);
    context.fillStyle = "#d7ad58";
    context.fill();
  }

  context.restore();
}

function drawFlowerLayer(canvasElement, context) {
  if (!canvasElement || !context) return;
  const width = theater.clientWidth;
  const height = theater.clientHeight;
  context.clearRect(0, 0, width, height);
  flowers.forEach(flower => drawFlower(context, flower));
}

function animateFlowers() {
  if (!flowerActive) return;

  const height = theater.clientHeight;

  flowers.forEach(flower => {
    flower.y += flower.speed;
    flower.x += flower.drift + Math.sin(flower.y * 0.015) * 0.4;
    flower.angle += flower.spin;
  });

  flowers = flowers.filter(flower => flower.y < height + 30);

  while (flowers.length < 70) {
    flowers.push(makeFlower());
  }

  // Render the same shower across both full-screen canvases.
  // CSS controls which canvas is visible in each scene.
  drawFlowerLayer(welcomeFlowerCanvas, welcomeFlowerCtx);
  drawFlowerLayer(flowerCanvas, flowerCtx);

  flowerFrame = requestAnimationFrame(animateFlowers);
}

function startFlowers() {
  stopFlowers();
  resizeCanvas(welcomeFlowerCanvas, welcomeFlowerCtx);
  resizeCanvas(flowerCanvas, flowerCtx);

  flowers = Array.from({ length: 70 }, () => makeFlower(true));
  flowerActive = true;

  // Draw immediately so the shower is visible as soon as the scene starts.
  drawFlowerLayer(welcomeFlowerCanvas, welcomeFlowerCtx);
  drawFlowerLayer(flowerCanvas, flowerCtx);
  flowerFrame = requestAnimationFrame(animateFlowers);
}

function stopFlowers() {
  flowerActive = false;

  if (flowerFrame !== null) {
    cancelAnimationFrame(flowerFrame);
    flowerFrame = null;
  }

  flowers = [];

  if (welcomeFlowerCtx && welcomeFlowerCanvas) {
    welcomeFlowerCtx.clearRect(0, 0, welcomeFlowerCanvas.width, welcomeFlowerCanvas.height);
  }
  if (flowerCtx && flowerCanvas) {
    flowerCtx.clearRect(0, 0, flowerCanvas.width, flowerCanvas.height);
  }
}

/* Wedding animation timeline */

function startWeddingAnimation() {
  if (animationRunning) return;
  animationRunning = true;
  clearAnimationTimers();
  stopFireworks();
  stopFlowers();
  galleryStarted = false;
  dateHasStarted = false;
  clearTimeout(galleryTimer);
  galleryRevealTimers.forEach(clearTimeout);
  galleryRevealTimers = [];
  photoGallery.style.visibility = "";
  photoGallery.classList.remove("is-active", "is-leaving");
  galleryTiles.forEach(({ tile }) => tile.classList.remove("is-visible"));
  theater.classList.remove("open", "date-mode");
  resizeAllCanvases();
  startFlowers();

  // Curtains open in 4.5s. Welcome remains for another 4.5s, then the
  // full-screen gallery runs, followed by a permanent date reveal.
  requestAnimationFrame(() => theater.classList.add("open"));
  scheduleAnimation(revealGallery, CURTAIN_DURATION + INTRO_DURATION);

  // Stop the animation effects later, but never hide the final date screen.
  scheduleAnimation(() => {
    stopFireworks();
    stopFlowers();
    animationRunning = false;
  }, TOTAL_DURATION);
}

/* Start only after the visitor clicks */

function beginWedding() {
  if (animationRunning) return;

  // Call play() directly within the click handler for the best chance
  // of satisfying browser autoplay restrictions.
  if (bgMusic) {
    bgMusic.loop = true;
    bgMusic.volume = 0.5;

    bgMusic.play().catch(error => {
      console.warn("Music playback was blocked:", error);
    });
  }

  if (startButton) {
    startButton.disabled = true;
    startButton.setAttribute("aria-hidden", "true");
  }

  theater.classList.add("started");

  startWeddingAnimation();
}

if (startButton) {
  startButton.addEventListener("click", beginWedding);
}

window.addEventListener("resize", resizeAllCanvases);

  </script>
